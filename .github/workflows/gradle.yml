name: Gradle

on: [push, pull_request]

jobs:
  build:

    strategy:
      matrix:
        os: [ubuntu-latest]
        java: [17, 21, 25]
        include:
          - os: windows-latest
            java: 17
          - os: macos-latest
            java: 17

    runs-on: ${{ matrix.os }}
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@v6
    - name: Set up JDK ${{ matrix.java }}
      uses: actions/setup-java@v5
      with:
        java-version: ${{ matrix.java }}
        distribution: 'temurin'
    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4
    - name: Install Xvfb (Linux)
      if: runner.os == 'Linux'
      run: sudo apt-get install -y xvfb
    - name: Build with Gradle (Linux)
      if: runner.os == 'Linux'
      run: xvfb-run --auto-servernum ./gradlew clean build --no-daemon --no-watch-fs
    - name: Build with Gradle (Windows)
      if: runner.os == 'Windows'
      shell: bash
      run: ./gradlew clean build --no-daemon --no-watch-fs
    - name: Build with Gradle (macOS)
      if: runner.os == 'macOS'
      shell: bash
      env:
        # Prevent the JVM from registering a Dock icon on macOS, which can delay
        # AWT initialization on headful CI runners.
        _JAVA_OPTIONS: -Dapple.awt.UIElement=true
      run: ./gradlew clean build --no-daemon --no-watch-fs
