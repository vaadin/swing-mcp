name: Gradle

on: [push, pull_request]

jobs:
  build:

    strategy:
      fail-fast: false
      # TEMPORARY: matrix trimmed to one Linux probe + macOS while we debug
      # the macOS hang. Restore full matrix (Linux 17/21/25 + Windows 17)
      # before merge.
      matrix:
        os: [ubuntu-latest]
        java: [17]
        include:
          - os: macos-latest
            java: 17

    runs-on: ${{ matrix.os }}
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@v6
    - name: Set up JDK ${{ matrix.java }}
      uses: actions/setup-java@v5
      with:
        java-version: ${{ matrix.java }}
        distribution: 'temurin'
    - name: Cache Gradle packages
      uses: actions/cache@v5
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle', 'gradle/wrapper/gradle-wrapper.properties') }}
    - name: Install Xvfb (Linux)
      if: runner.os == 'Linux'
      run: sudo apt-get install -y xvfb
    - name: Build with Gradle (Linux)
      if: runner.os == 'Linux'
      run: xvfb-run --auto-servernum ./gradlew clean build --stacktrace --info --no-daemon
    - name: Build with Gradle (Windows)
      if: runner.os == 'Windows'
      shell: bash
      run: ./gradlew clean build --stacktrace --info --no-daemon
    - name: Build with Gradle (macOS)
      if: runner.os == 'macOS'
      shell: bash
      env:
        # Prevent the JVM from registering a Dock icon on macOS, which can delay
        # AWT initialization on headful CI runners.
        _JAVA_OPTIONS: -Dapple.awt.UIElement=true
      # --debug so we can see the last Gradle action before a hang.
      run: ./gradlew clean build --stacktrace --debug --no-daemon

